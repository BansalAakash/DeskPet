<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DeskPet</title>
<style>
  :root {
    --ink: #211f1c;
    --paper: #fdfaf2;
    --paper-dim: #f3ecdc;
    --blush: #ef8fb4;
    --blush-ink: #6b2e42;
    --cat: #4fb2d6;
    --dog: #dd9138;
    --line: rgba(33, 31, 28, 0.12);
    --line-hover: rgba(33, 31, 28, 0.28);
    --focus: #4a90d9;
    --cta-shadow: rgba(239, 143, 180, 0.4);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f3ecdc;
      --paper: #201d19;
      --paper-dim: #2a2521;
      --blush: #f2a0c2;
      --blush-ink: #2c1219;
      --cat: #6fcdf0;
      --dog: #eaa855;
      --line: rgba(243, 236, 220, 0.16);
      --line-hover: rgba(243, 236, 220, 0.32);
      --cta-shadow: rgba(242, 160, 194, 0.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    width: 280px;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .dp-header {
    position: relative;
    height: 96px;
    background: var(--paper-dim);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  .dp-toprow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 12px 0;
  }

  .dp-title {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dp-emoji { font-size: 17px; }
  .dp-title-text {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .dp-enabled {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--blush);
    cursor: pointer;
  }
  .dp-enabled:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .dp-peek {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 148px;
    height: 132px;
    transform: translate(-50%, 0);
  }
  .dp-peek-img {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.12));
    transition: transform 0.15s ease;
  }
  .dp-peek:hover .dp-peek-img {
    transform: translateY(-3px);
  }
  @media (prefers-reduced-motion: reduce) {
    .dp-peek-img { transition: none; }
  }

  .dp-body {
    padding: 14px 12px 12px;
  }

  .dp-section + .dp-section {
    margin-top: 12px;
  }

  .dp-label {
    margin: 0 0 6px;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.78;
  }

  .dp-segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .dp-seg {
    position: relative;
    display: block;
  }
  .dp-seg input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .dp-seg span {
    display: block;
    padding: 7px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-dim);
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .dp-seg input:checked ~ span {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .dp-seg input:not(:checked):hover ~ span {
    border-color: var(--line-hover);
  }
  .dp-seg input:focus-visible ~ span {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .dp-chips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .dp-chip {
    position: relative;
    display: block;
  }
  .dp-chip input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .dp-chip span {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-dim);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    opacity: 0.78;
    transition: opacity 0.12s ease, border-color 0.12s ease;
  }
  .dp-chip span::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot);
  }
  .dp-chip-cat span { --dot: var(--cat); }
  .dp-chip-dog span { --dot: var(--dog); }
  .dp-chip input:not(:checked):hover ~ span {
    opacity: 0.92;
    border-color: var(--line-hover);
  }
  .dp-chip input:checked ~ span {
    opacity: 1;
    border-color: var(--dot);
  }
  .dp-chip input:focus-visible ~ span {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .dp-cta {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 9px 0;
    border: none;
    border-radius: 9px;
    background: var(--blush);
    color: var(--blush-ink);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 3px 8px var(--cta-shadow);
    transition: transform 0.08s ease, filter 0.12s ease, box-shadow 0.08s ease;
  }
  .dp-cta:hover { filter: brightness(1.05); }
  .dp-cta:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px var(--cta-shadow);
  }
  .dp-cta:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .dp-hint {
    margin: 10px 2px 0;
    font-size: 10px;
    line-height: 1.4;
    opacity: 0.72;
  }
</style>
</head>
<body>
  <header class="dp-header">
    <div class="dp-toprow">
      <div class="dp-title">
        <span class="dp-emoji" aria-hidden="true">🐾</span>
        <span class="dp-title-text">DeskPet</span>
      </div>
      <input type="checkbox" id="enabled" class="dp-enabled" title="Enabled" aria-label="Enable DeskPet">
    </div>
    <div class="dp-peek">
      <img id="peekImg" class="dp-peek-img" alt="" draggable="false">
    </div>
  </header>

  <main class="dp-body">
    <section class="dp-section">
      <h2 class="dp-label">Frequency</h2>
      <div class="dp-segmented" role="radiogroup" aria-label="Frequency">
        <label class="dp-seg">
          <input type="radio" name="frequency" value="ultraOften">
          <span>Ultra Often</span>
        </label>
        <label class="dp-seg">
          <input type="radio" name="frequency" value="often">
          <span>Often</span>
        </label>
        <label class="dp-seg">
          <input type="radio" name="frequency" value="normal">
          <span>Normal</span>
        </label>
        <label class="dp-seg">
          <input type="radio" name="frequency" value="rare">
          <span>Rare</span>
        </label>
      </div>
    </section>

    <section class="dp-section">
      <h2 class="dp-label">Animals</h2>
      <div class="dp-chips" role="group" aria-label="Animals">
        <label class="dp-chip dp-chip-cat">
          <input type="checkbox" id="species-cat">
          <span>Cat</span>
        </label>
        <label class="dp-chip dp-chip-dog">
          <input type="checkbox" id="species-dog">
          <span>Dog</span>
        </label>
      </div>
    </section>

    <button id="peekNow" class="dp-cta">Peek Now</button>

    <p class="dp-hint">Peeks in from the edge of whichever tab you're looking at.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
